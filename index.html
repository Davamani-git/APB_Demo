<!DOCTYPE html>
<html lang="en" ng-app="apbApp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Portfolio Management Dashboard</title>
  <link rel="stylesheet" href="src/app/app.css">
</head>
<body>
  <div ng-controller="loginController as login" ng-if="!login.isAuthenticated()">
    <h2>Sign In</h2>
    <button ng-click="login.signIn()">Login with SSO</button>
  </div>
  <div ng-if="true">
    <nav>
      <a href="#!/dashboard">Dashboard</a> |
      <a href="#!/integration">Integration</a> |
      <a href="#!/admin">Admin</a>
    </nav>
    <div ui-view></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.7.9/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.30/angular-ui-router.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>

  <script src="src/app/app.module.js"></script>
  <script src="src/app/app.config.js"></script>

  <script src="src/app/services/credential.service.js"></script>
  <script src="src/app/services/notification.service.js"></script>
  <script src="src/app/services/jwtHelper.service.js"></script>

  <script src="src/app/common/interceptors/auth.interceptor.js"></script>

  <script src="src/app/auth/services/auth.service.js"></script>
  <script src="src/app/auth/services/rbac.service.js"></script>
  <script src="src/app/auth/services/route-guard.service.js"></script>
  <script src="src/app/auth/services/audit.service.js"></script>
  <script src="src/app/auth/controllers/login.controller.js"></script>

  <script src="src/app/admin/services/alert-monitor.service.js"></script>
  <script src="src/app/admin/controllers/admin.controller.js"></script>

  <script src="src/app/integration/services/cloud-integration.service.js"></script>
  <script src="src/app/integration/services/data-aggregation.service.js"></script>
  <script src="src/app/integration/services/data-freshness.service.js"></script>
  <script src="src/app/integration/services/alert.service.js"></script>
  <script src="src/app/integration/factories/data-normalization.factory.js"></script>
  <script src="src/app/integration/controllers/integration.controller.js"></script>

  <script src="src/app/dashboard/services/dashboard.service.js"></script>
  <script src="src/app/dashboard/services/analytics.service.js"></script>
  <script src="src/app/dashboard/services/benchmarking.service.js"></script>
  <script src="src/app/dashboard/services/recommendation.service.js"></script>
  <script src="src/app/dashboard/services/report.service.js"></script>
  <script src="src/app/dashboard/directives/widget.directive.js"></script>
  <script src="src/app/dashboard/controllers/dashboard.controller.js"></script>
  <script src="src/app/dashboard/controllers/drilldown.controller.js"></script>
</body>
</html>
