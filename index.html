<!DOCTYPE html>
<html ng-app="fraudAlertApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Fraud Alert System</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body { padding: 20px; }
    .risk-low { background-color: #d4edda; }
    .risk-medium { background-color: #fff3cd; }
    .risk-high { background-color: #f8d7da; }
    .transaction-card { margin-bottom: 15px; padding: 15px; border-radius: 5px; }
    .alert-badge { font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fraud Alert Dashboard</h1>
    <div ng-view></div>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.min.js"></script>
  <script src="https://angular-ui.github.io/bootstrap/ui-bootstrap-tpls-2.5.0.min.js"></script>
  <script src="src/app/app.module.js"></script>
  <script src="src/app/fraud-alert/fraud-alert.module.js"></script>
  <script src="src/app/services/auth.interceptor.js"></script>
  <script src="src/app/services/audit.service.js"></script>
  <script src="src/app/fraud-alert/services/transaction-ingestion.service.js"></script>
  <script src="src/app/fraud-alert/services/fraud-risk.service.js"></script>
  <script src="src/app/fraud-alert/services/policy-decision.service.js"></script>
  <script src="src/app/fraud-alert/services/alert.service.js"></script>
  <script src="src/app/fraud-alert/factories/risk-threshold.factory.js"></script>
  <script src="src/app/fraud-alert/controllers/dashboard.controller.js"></script>
  <script src="src/app/fraud-alert/controllers/alert.controller.js"></script>
</body>
</html>
