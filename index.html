<!DOCTYPE html>
<html lang="en" ng-app="ccdDashboardApp">
<head>
  <meta charset="UTF-8">
  <title>Credit Card Analysis Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/app/assets/css/app.css">
  <link rel="stylesheet" href="src/app/assets/css/responsive.css">
</head>
<body>
  <div ng-controller="ShellController as vm">
    <navbar></navbar>
    <div class="container" ng-class="{ 'loading': vm.isLoading }">
      <loading-spinner is-busy="vm.isLoading"></loading-spinner>
      <error-banner error="vm.globalError" on-retry="vm.onRetry()"></error-banner>
      <div ng-view></div>
    </div>
    <footer-bar></footer-bar>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-animate.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-sanitize.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>

  <script src="src/app/app/app.module.js"></script>
  <script src="src/app/app/app.config.js"></script>
  <script src="src/app/app/app.run.js"></script>

  <script src="src/app/app/core/core.module.js"></script>
  <script src="src/app/app/core/config/env.config.js"></script>
  <script src="src/app/app/core/config/api.config.js"></script>
  <script src="src/app/app/core/services/http-interceptor.factory.js"></script>
  <script src="src/app/app/core/services/auth-token.service.js"></script>
  <script src="src/app/app/core/services/logging.service.js"></script>
  <script src="src/app/app/core/services/error-handler.service.js"></script>

  <script src="src/app/app/layout/layout.module.js"></script>
  <script src="src/app/app/layout/shell.controller.js"></script>
  <script src="src/app/app/layout/navbar.directive.js"></script>
  <script src="src/app/app/layout/footer.directive.js"></script>

  <script src="src/app/app/dashboard/dashboard.module.js"></script>
  <script src="src/app/app/dashboard/dashboard.routes.js"></script>
  <script src="src/app/app/dashboard/controllers/dashboard-summary.controller.js"></script>
  <script src="src/app/app/dashboard/services/dashboard-summary.service.js"></script>
  <script src="src/app/app/dashboard/models/dashboard-summary.model.js"></script>
  <script src="src/app/app/dashboard/directives/kpi-tile.directive.js"></script>
  <script src="src/app/app/dashboard/directives/summary-chart.directive.js"></script>

  <script src="src/app/app/shared/shared.module.js"></script>
  <script src="src/app/app/shared/directives/loading-spinner.directive.js"></script>
  <script src="src/app/app/shared/directives/error-banner.directive.js"></script>
  <script src="src/app/app/shared/filters/currency-with-symbol.filter.js"></script>
  <script src="src/app/app/shared/filters/percentage.filter.js"></script>
  <script src="src/app/app/shared/models/card.model.js"></script>
  <script src="src/app/app/shared/models/transaction-aggregate.model.js"></script>
</body>
</html>
