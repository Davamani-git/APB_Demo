<div class="row">
  <div class="col-md-12">
    <h2>User Management</h2>
    <div class="panel panel-default">
      <div class="panel-heading">Create New User</div>
      <div class="panel-body">
        <form ng-submit="vm.createUser()">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Email" ng-model="vm.newUser.email" required>
          </div>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Name" ng-model="vm.newUser.name" required>
          </div>
          <div class="form-group">
            <select class="form-control" ng-model="vm.newUser.role" required>
              <option value="">Select Role</option>
              <option value="EnterpriseAdmin">Enterprise Admin</option>
              <option value="CompanyAdmin">Company Admin</option>
              <option value="Viewer">Viewer</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success">Create User</button>
        </form>
      </div>
    </div>
    <div class="panel panel-default">
      <div class="panel-heading">Existing Users</div>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Email</th>
            <th>Name</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="user in vm.users">
            <td>{{user.email}}</td>
            <td>{{user.name}}</td>
            <td>{{user.role}}</td>
            <td>
              <button class="btn btn-sm btn-primary" ng-click="vm.updateUser(user)">Edit</button>
              <button class="btn btn-sm btn-danger" ng-click="vm.deleteUser(user.id)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
