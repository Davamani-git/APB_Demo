<div class="row">
  <div class="col-md-12">
    <h2>AI Portfolio Dashboard</h2>
    <div class="form-group">
      <label>Select Company:</label>
      <select class="form-control" ng-model="vm.selectedCompany" ng-change="vm.selectCompany(vm.selectedCompany)">
        <option ng-repeat="c in vm.companies" value="{{c.id}}">{{c.name}}</option>
      </select>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-md-4">
    <div class="widget-card">
      <h4>Total Cost</h4>
      <div class="metric-value">{{vm.totalCost | portfolioCurrency:'USD'}}</div>
    </div>
  </div>
  <div class="col-md-4">
    <ai-usage-widget company-id="vm.selectedCompany"></ai-usage-widget>
  </div>
</div>
<div class="row">
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading">Cost by Provider</div>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Provider</th>
            <th>Total Cost</th>
            <th>Record Count</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="p in vm.providerData">
            <td>{{p.provider}}</td>
            <td>{{p.totalCost | portfolioCurrency:'USD'}}</td>
            <td>{{p.count}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
