<div class="card-detail-container">
  <div ng-if="vm.loading" class="loading">Loading...</div>
  <div ng-if="!vm.loading">
    <h2>{{vm.card.name}} - **** {{vm.card.last4}}</h2>
    <div class="card-kpis">
      <kpi-card title="'Credit Limit'" value="vm.card.creditLimit" icon="'₹'"></kpi-card>
      <kpi-card title="'Available Credit'" value="vm.card.availableCredit" icon="'₹'"></kpi-card>
      <kpi-card title="'Outstanding Balance'" value="vm.card.outstandingBalance" icon="'₹'"></kpi-card>
    </div>
    <h3>Recent Transactions</h3>
    <table class="transaction-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Merchant</th>
          <th>Category</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="txn in vm.transactions">
          <td>{{txn.date}}</td>
          <td>{{txn.merchant}}</td>
          <td>{{txn.category}}</td>
          <td>₹{{txn.amount | number}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
