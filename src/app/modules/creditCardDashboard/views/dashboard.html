<div class="dashboard-container">
  <div class="page-header">
    <h1>Credit Card Analysis Dashboard
      <button class="btn btn-primary pull-right" ng-click="refreshDashboard()" ng-disabled="loading">
        <i class="glyphicon glyphicon-refresh" ng-class="{'glyphicon-refresh-animate': loading}"></i> Refresh
      </button>
    </h1>
  </div>
  
  <div ng-if="error" class="alert alert-danger alert-dismissible" role="alert">
    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
    <strong>Error!</strong> {{error}}
  </div>
  
  <div ng-if="loading" class="text-center">
    <i class="glyphicon glyphicon-refresh glyphicon-refresh-animate"></i>
    <p>Loading dashboard data...</p>
  </div>
  
  <div ng-if="!loading && summary">
    <div class="row">
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card title="Monthly Spend" value="${{summary.monthlySpend | number:2}}" icon="glyphicon-shopping-cart"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card title="Total Credit Limit" value="${{summary.totalCreditLimit | number:2}}" icon="glyphicon-credit-card"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card title="Available Credit" value="${{summary.totalAvailableCredit | number:2}}" icon="glyphicon-ok-circle"></kpi-card>
      </div>
      <div class="col-md-3 col-sm-6 col-xs-12">
        <kpi-card title="Outstanding Amount" value="${{summary.totalOutstandingAmount | number:2}}" icon="glyphicon-exclamation-sign"></kpi-card>
      </div>
    </div>
    
    <div class="row">
      <div class="col-xs-12">
        <credit-summary cards="summary.cards"></credit-summary>
      </div>
    </div>
    
    <div class="row">
      <div class="col-xs-12">
        <p class="text-muted text-right"><small>Last updated: {{summary.lastUpdated | date:'medium'}}</small></p>
      </div>
    </div>
  </div>
</div>
