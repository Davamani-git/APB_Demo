<div class="card" ng-if="vm.loading">
  <div class="loading">Loading order status...</div>
</div>
<div ng-if="!vm.loading">
  <div class="card" ng-if="vm.error">
    <div class="error-message">{{vm.error}}</div>
  </div>
  <div class="card">
    <h2>Order #{{vm.orderId}}</h2>
    <status-timeline current-status="orderStatus.currentStatus" status-history="orderStatus.statusHistory"></status-timeline>
  </div>
  <div class="card" ng-if="eta">
    <div class="eta-box">
      <h2>Estimated Delivery Time</h2>
      <p ng-if="eta.eta">{{eta.eta | date:'shortTime'}}</p>
      <p ng-if="!eta.eta">Calculating...</p>
      <p style="font-size: 12px; margin-top: 5px;">Confidence: {{eta.confidence}}</p>
    </div>
  </div>
</div>
