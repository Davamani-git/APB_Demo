<div class="row">
  <div class="col-md-12">
    <h2>Order Processing</h2>
    <hr>
    <div class="panel panel-default">
      <div class="panel-heading">Orders</div>
      <div class="panel-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Product ID</th>
              <th>Quantity</th>
              <th>Total Amount</th>
              <th>Order Status</th>
              <th>Payment Status</th>
              <th>Order Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="order in vm.orders track by order.orderId">
              <td>{{ order.orderId }}</td>
              <td>{{ order.productId }}</td>
              <td>{{ order.quantity }}</td>
              <td>{{ order.totalAmount | currency }}</td>
              <td>
                <select class="form-control input-sm" ng-model="order.orderStatus" ng-change="vm.updateOrderStatus(order.orderId, order.orderStatus)">
                  <option value="pending">Pending</option>
                  <option value="confirmed">Confirmed</option>
                  <option value="shipped">Shipped</option>
                  <option value="delivered">Delivered</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </td>
              <td><span class="label label-{{ order.paymentStatus === 'completed' ? 'success' : 'warning' }}">{{ order.paymentStatus }}</span></td>
              <td>{{ order.orderDate | date:'short' }}</td>
              <td>
                <button class="btn btn-sm btn-info" ng-click="vm.updateShippingInfo(order.orderId, prompt('Enter tracking ID'))">Add Tracking</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div ng-if="vm.orders.length === 0" class="text-center">
          <p>No orders found.</p>
        </div>
      </div>
    </div>
  </div>
</div>
