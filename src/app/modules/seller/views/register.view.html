<div class="row">
  <div class="col-md-6 col-md-offset-3">
    <div class="panel panel-default">
      <div class="panel-heading">
        <h3 class="panel-title">Seller Registration</h3>
      </div>
      <div class="panel-body">
        <form ng-submit="vm.register()">
          <div class="form-group">
            <label for="businessName">Business Name</label>
            <input type="text" class="form-control" id="businessName" ng-model="vm.sellerData.businessName" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" ng-model="vm.sellerData.email" required>
          </div>
          <div class="form-group">
            <label for="contactNumber">Contact Number</label>
            <input type="tel" class="form-control" id="contactNumber" ng-model="vm.sellerData.contactNumber" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" ng-model="vm.sellerData.password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
        <hr>
        <p class="text-center"><a href="#!/login">Already have an account? Login</a></p>
      </div>
    </div>
  </div>
</div>
