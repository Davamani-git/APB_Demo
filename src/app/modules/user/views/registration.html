<div class="registration-container" ng-controller="RegistrationController">
  <form name="registrationForm" ng-submit="register(registrationForm)" novalidate>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" ng-model="user.email" required />
      <div ng-messages="registrationForm.email.$error" ng-if="registrationForm.email.$touched">
        <div ng-message="required">Email is required.</div>
        <div ng-message="email">Enter a valid email.</div>
      </div>
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" ng-model="user.password" ng-minlength="8" required />
      <div ng-messages="registrationForm.password.$error" ng-if="registrationForm.password.$touched">
        <div ng-message="required">Password is required.</div>
        <div ng-message="minlength">Password must be at least 8 characters.</div>
      </div>
    </div>

    <div>
      <label for="firstName">First Name</label>
      <input id="firstName" name="firstName" type="text" ng-model="user.firstName" required />
      <div ng-messages="registrationForm.firstName.$error" ng-if="registrationForm.firstName.$touched">
        <div ng-message="required">First name is required.</div>
      </div>
    </div>

    <div>
      <label for="lastName">Last Name</label>
      <input id="lastName" name="lastName" type="text" ng-model="user.lastName" required />
      <div ng-messages="registrationForm.lastName.$error" ng-if="registrationForm.lastName.$touched">
        <div ng-message="required">Last name is required.</div>
      </div>
    </div>

    <button type="submit" ng-disabled="registrationForm.$invalid || isSubmitting">
      {{ isSubmitting ? 'Registering...' : 'Register' }}
    </button>

    <div class="alert alert-success" ng-if="registrationSuccess && emailQueued">
      Registration successful. A confirmation email has been sent to {{ user.email }}.
    </div>

    <div class="alert alert-danger" ng-if="errorMessage">
      {{ errorMessage }}
    </div>
  </form>
</div>
