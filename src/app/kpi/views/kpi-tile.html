<div class="panel panel-default kpi-tile">
  <div class="panel-heading">
    <h3 class="panel-title" ng-bind="kpi.name"></h3>
  </div>
  <div class="panel-body">
    <p class="kpi-value" ng-bind="kpi.value + ' ' + kpi.unit"></p>
    <status-badge status="kpi.status"></status-badge>
    <p ng-if="kpi.plannedCompletionDate">Planned completion: <span ng-bind="kpi.plannedCompletionDate"></span></p>
    <button type="button" class="btn btn-xs btn-primary" ng-click="kpiVm.editKpi(kpi)">Edit</button>
  </div>
</div>
