<div class="row">
  <div class="col-md-12">
    <h2>Product Catalog</h2>
    <div class="filter-panel">
      <div class="row">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Search by keyword" ng-model="vm.filters.keyword" ng-change="vm.searchProducts()">
        </div>
        <div class="col-md-3">
          <select class="form-control" ng-model="vm.filters.category" ng-change="vm.searchProducts()">
            <option value="">All Categories</option>
            <option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-control" ng-model="vm.filters.sortBy" ng-change="vm.searchProducts()">
            <option value="">Sort By</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Rating</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary btn-block" ng-click="vm.searchProducts()">Search</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row" ng-if="vm.loading">
  <div class="col-md-12 text-center">
    <p>Loading products...</p>
  </div>
</div>
<div class="row" ng-if="!vm.loading">
  <div class="col-md-4" ng-repeat="product in vm.products">
    <div class="product-card">
      <img ng-src="{{product.imageUrl}}" class="product-image" alt="{{product.name}}">
      <h4>{{product.name}}</h4>
      <p>{{product.description}}</p>
      <p><strong>${{product.price}}</strong></p>
      <p>Rating: {{product.ratings}} / 5</p>
      <p>Stock: {{product.stock}}</p>
      <div class="btn-group btn-group-justified">
        <a href="#!/product/{{product.productId}}" class="btn btn-info">View Details</a>
        <button class="btn btn-success" ng-click="vm.addToCart(product)">Add to Cart</button>
      </div>
    </div>
  </div>
</div>
<div class="row" ng-if="!vm.loading && vm.products.length === 0">
  <div class="col-md-12 text-center">
    <p>No products found.</p>
  </div>
</div>
