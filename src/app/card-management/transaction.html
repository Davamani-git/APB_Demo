<div class="transaction-container">
  <h3>Transaction History</h3>
  <div class="filter-panel">
    <div class="row">
      <div class="col-md-3">
        <input type="text" class="form-control" placeholder="Merchant" ng-model="vm.filters.merchantName">
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" placeholder="Min Amount" ng-model="vm.filters.minAmount">
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" placeholder="Max Amount" ng-model="vm.filters.maxAmount">
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary" ng-click="vm.applyFilters()">Apply Filters</button>
      </div>
    </div>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading transactions...</p>
  </div>
  <div ng-if="!vm.loading && vm.transactions.length > 0">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Date</th>
          <th>Merchant</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="txn in vm.transactions">
          <td>{{txn.date | date:'dd/MM/yyyy'}}</td>
          <td>{{txn.merchantName}}</td>
          <td>{{txn.category}}</td>
          <td>₹{{txn.amount | number:2}}</td>
          <td>{{txn.status}}</td>
        </tr>
      </tbody>
    </table>
    <div class="text-center">
      <button class="btn btn-default" ng-click="vm.previousPage()" ng-disabled="vm.filters.pageNumber <= 1">Previous</button>
      <span>Page {{vm.filters.pageNumber}}</span>
      <button class="btn btn-default" ng-click="vm.nextPage()" ng-disabled="vm.transactions.length < vm.filters.pageSize">Next</button>
    </div>
  </div>
  <div ng-if="!vm.loading && vm.transactions.length === 0">
    <p>No transactions found for this card.</p>
  </div>
</div>
