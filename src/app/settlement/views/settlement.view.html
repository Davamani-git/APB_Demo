<div class="panel panel-default"><div class="panel-heading"><h3>Settlement Batches <button class="btn btn-primary btn-sm pull-right" ng-click="settleCtrl.createBatch()">Create Batch</button></h3></div><div class="panel-body"><div class="alert alert-danger" ng-if="settleCtrl.error">{{settleCtrl.error}}</div><table class="table table-striped"><thead><tr><th>Batch ID</th><th>Merchant ID</th><th>Gross Amount</th><th>Fees</th><th>Net Funding</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr ng-repeat="batch in settleCtrl.batches"><td>{{batch.batchId}}</td><td>{{batch.merchantId}}</td><td>{{batch.grossAmount}} {{batch.currency}}</td><td>{{batch.fees}} {{batch.currency}}</td><td>{{batch.netFunding}} {{batch.currency}}</td><td><span class="label label-info">{{batch.status}}</span></td><td><button class="btn btn-xs btn-success" ng-click="settleCtrl.schedulePayout(batch.batchId)" ng-disabled="batch.status!=='PENDING'">Schedule Payout</button></td></tr></tbody></table></div></div>
