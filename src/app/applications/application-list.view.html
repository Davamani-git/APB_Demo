<div class="application-list-container">
  <div class="page-header">
    <h2>Provider Enrollment Applications</h2>
  </div>
  <div class="filter-panel panel panel-default">
    <div class="panel-body">
      <form class="form-inline">
        <div class="form-group">
          <label>Status:</label>
          <select class="form-control" ng-model="vm.filters.status">
            <option value="">All</option>
            <option value="Ready to Submit">Ready to Submit</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Expiring Soon">Expiring Soon</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payer:</label>
          <input type="text" class="form-control" ng-model="vm.filters.payer" placeholder="Filter by payer">
        </div>
        <div class="form-group">
          <label>Coordinator:</label>
          <input type="text" class="form-control" ng-model="vm.filters.coordinator" placeholder="Filter by coordinator">
        </div>
        <button type="button" class="btn btn-primary" ng-click="vm.applyFilters()">Apply</button>
        <button type="button" class="btn btn-default" ng-click="vm.clearFilters()">Clear</button>
      </form>
    </div>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading applications...</p>
  </div>
  <div ng-if="!vm.loading" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th ng-click="vm.setSortBy('providerName')" style="cursor:pointer;">Provider Name</th>
          <th ng-click="vm.setSortBy('applicationType')" style="cursor:pointer;">Type</th>
          <th>Target Payers</th>
          <th ng-click="vm.setSortBy('overallStatus')" style="cursor:pointer;">Overall Status</th>
          <th ng-click="vm.setSortBy('startDate')" style="cursor:pointer;">Start Date</th>
          <th>Days Until Start</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="app in vm.applications | orderBy:vm.sortBy:vm.sortReverse">
          <td>{{app.providerName}}</td>
          <td>{{app.applicationType}}</td>
          <td><span ng-repeat="payer in app.targetPayers">{{payer}}<span ng-if="!$last">, </span></span></td>
          <td><readiness-status-badge status="app.overallStatus"></readiness-status-badge></td>
          <td>{{app.startDate | date:'MM/dd/yyyy'}}</td>
          <td>{{app.daysUntilStart}}</td>
          <td><button class="btn btn-sm btn-info" ng-click="vm.viewApplication(app.id)">View</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
