<div class="container">
  <h2>Product Management</h2>
  <div class="row">
    <div class="col-md-6">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Add New Product</h4>
        </div>
        <div class="panel-body">
          <form ng-submit="vm.submitProduct()">
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" class="form-control" ng-model="vm.newProduct.name" required>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea class="form-control" ng-model="vm.newProduct.description" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label>Price</label>
              <input type="number" class="form-control" ng-model="vm.newProduct.price" step="0.01" required>
            </div>
            <div class="form-group">
              <label>Category</label>
              <input type="text" class="form-control" ng-model="vm.newProduct.category" required>
            </div>
            <div class="form-group">
              <label>Stock</label>
              <input type="number" class="form-control" ng-model="vm.newProduct.stock" required>
            </div>
            <image-upload-directive on-upload="vm.onImagesUploaded(urls)"></image-upload-directive>
            <button type="submit" class="btn btn-primary">Add Product</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>My Products</h4>
        </div>
        <div class="panel-body">
          <div ng-repeat="product in vm.products track by product.productId" class="product-item">
            <h5>{{product.name}}</h5>
            <p>Price: ${{product.price}} | Stock: {{product.stock}}</p>
            <hr>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
