<div class="product-view">
  <div class="row">
    <div class="col-md-12">
      <h2>Products</h2>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <div class="search-bar">
        <div class="input-group">
          <input type="text" class="form-control" placeholder="Search products..." ng-model="vm.searchQuery" ng-keyup="$event.keyCode == 13 && vm.search()" aria-label="Search products">
          <span class="input-group-btn">
            <button class="btn btn-primary" type="button" ng-click="vm.search()" aria-label="Search">Search</button>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="row" style="margin-top: 20px;">
    <div class="col-md-3">
      <div class="panel panel-default">
        <div class="panel-heading">Filters</div>
        <div class="panel-body">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" class="form-control" ng-model="vm.filters.category" ng-change="vm.applyFilters()">
              <option value="">All Categories</option>
              <option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="minPrice">Min Price</label>
            <input type="number" id="minPrice" class="form-control" ng-model="vm.filters.minPrice" placeholder="Min">
          </div>
          <div class="form-group">
            <label for="maxPrice">Max Price</label>
            <input type="number" id="maxPrice" class="form-control" ng-model="vm.filters.maxPrice" placeholder="Max">
          </div>
          <div class="form-group">
            <label for="sortBy">Sort By</label>
            <select id="sortBy" class="form-control" ng-model="vm.filters.sortBy" ng-change="vm.applyFilters()">
              <option ng-repeat="opt in vm.sortOptions" value="{{opt.value}}">{{opt.label}}</option>
            </select>
          </div>
          <button class="btn btn-primary btn-block" ng-click="vm.applyFilters()">Apply Filters</button>
          <button class="btn btn-default btn-block" ng-click="vm.clearFilters()">Clear Filters</button>
        </div>
      </div>
    </div>
    <div class="col-md-9">
      <div ng-if="vm.loading" class="text-center">
        <p>Loading products...</p>
      </div>
      <div ng-if="vm.error" class="alert alert-danger" role="alert">{{vm.error}}</div>
      <div ng-if="!vm.loading && vm.products.length === 0" class="alert alert-info" role="alert">No products found.</div>
      <div class="row">
        <div class="col-md-4" ng-repeat="product in vm.products">
          <div class="panel panel-default product-card">
            <div class="panel-body">
              <img ng-src="{{product.imageUrl}}" alt="{{product.name}}" class="img-responsive" style="width:100%;height:200px;object-fit:cover;">
              <h4>{{product.name}}</h4>
              <p>{{product.description | limitTo:100}}{{product.description.length > 100 ? '...' : ''}}</p>
              <p><strong>Price: ${{product.price}}</strong></p>
              <p>Rating: {{product.averageRating || 'N/A'}} / 5</p>
              <p ng-if="product.stock > 0" class="text-success">In Stock</p>
              <p ng-if="product.stock === 0" class="text-danger">Out of Stock</p>
              <button class="btn btn-primary btn-sm" ng-click="vm.addToCart(product)" ng-disabled="product.stock === 0">Add to Cart</button>
              <button class="btn btn-default btn-sm" ng-click="vm.addToWishlist(product)">Wishlist</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
