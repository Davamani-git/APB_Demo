<div class="panel panel-warning"><div class="panel-heading">Strong Customer Authentication Required</div><div class="panel-body"><div class="alert alert-danger" ng-if="error">{{error}}</div><p>Please provide two independent authentication factors:</p><div class="form-group"><label>Factor 1 (Password)</label><input type="password" class="form-control" ng-model="scaFactors.factor1" required></div><div class="form-group"><label>Factor 2 (OTP)</label><input type="text" class="form-control" ng-model="scaFactors.factor2" required></div><button class="btn btn-warning" ng-click="submitSCA()" ng-disabled="loading||!scaFactors.factor1||!scaFactors.factor2">Authenticate</button></div></div>
