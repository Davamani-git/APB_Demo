<div class="panel panel-primary"><div class="panel-heading"><h3>Initiate Payment</h3></div><div class="panel-body"><form name="paymentForm" ng-submit="payCtrl.initiatePayment()" novalidate><div class="alert alert-danger" ng-if="payCtrl.error">{{payCtrl.error}}</div><div class="alert alert-success" ng-if="payCtrl.success">{{payCtrl.success}}</div><div class="form-group"><label>Payer ID *</label><input type="text" class="form-control" ng-model="payCtrl.payment.payerId" required></div><div class="form-group"><label>Payee ID *</label><input type="text" class="form-control" ng-model="payCtrl.payment.payeeId" required></div><div class="form-group"><label>Amount *</label><input type="number" class="form-control" ng-model="payCtrl.payment.amount" min="0.01" step="0.01" required></div><div class="form-group"><label>Currency</label><select class="form-control" ng-model="payCtrl.payment.currency"><option value="GBP">GBP</option><option value="EUR">EUR</option><option value="USD">USD</option></select></div><div class="form-group"><label>Channel</label><select class="form-control" ng-model="payCtrl.payment.channel"><option value="ONLINE">Online</option><option value="PAYMENT_LINK">Payment Link</option><option value="TERMINAL">Terminal</option><option value="INVOICE">Invoice</option></select></div><div class="form-group"><label>Card Number (PAN) *</label><input type="text" class="form-control" ng-model="payCtrl.payment.pan" maxlength="19" required></div><button type="submit" class="btn btn-primary" ng-disabled="payCtrl.loading||!paymentForm.$valid">Initiate Payment</button></form></div></div>
