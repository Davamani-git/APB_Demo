<div>
  <h2>Checkout</h2>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading checkout...</p>
  </div>
  <div ng-if="!vm.loading && vm.checkoutData">
    <div class="row">
      <div class="col-md-8">
        <div class="panel panel-default">
          <div class="panel-heading"><h4>Shipping Address</h4></div>
          <div class="panel-body">
            <form>
              <div class="form-group">
                <label>Street Address</label>
                <input type="text" class="form-control" ng-model="vm.shippingAddress.street" required>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>City</label>
                    <input type="text" class="form-control" ng-model="vm.shippingAddress.city" required>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-group">
                    <label>State</label>
                    <input type="text" class="form-control" ng-model="vm.shippingAddress.state" required>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-group">
                    <label>Zip Code</label>
                    <input type="text" class="form-control" ng-model="vm.shippingAddress.zipCode" required>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label>Country</label>
                <input type="text" class="form-control" ng-model="vm.shippingAddress.country" required>
              </div>
            </form>
          </div>
        </div>
        <div class="panel panel-default">
          <div class="panel-heading"><h4>Payment Information</h4></div>
          <div class="panel-body">
            <div class="form-group">
              <label>Payment Method</label>
              <select class="form-control" ng-model="vm.paymentMethod">
                <option value="credit_card">Credit Card</option>
                <option value="paypal">PayPal</option>
                <option value="debit_card">Debit Card</option>
              </select>
            </div>
            <div ng-if="vm.paymentMethod === 'credit_card' || vm.paymentMethod === 'debit_card'">
              <div class="form-group">
                <label>Card Number</label>
                <input type="text" class="form-control" ng-model="vm.paymentDetails.cardNumber" placeholder="1234 5678 9012 3456" required>
              </div>
              <div class="form-group">
                <label>Cardholder Name</label>
                <input type="text" class="form-control" ng-model="vm.paymentDetails.cardName" required>
              </div>
              <div class="row">
                <div class="col-md-4">
                  <div class="form-group">
                    <label>Expiry Month</label>
                    <input type="text" class="form-control" ng-model="vm.paymentDetails.expiryMonth" placeholder="MM" required>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group">
                    <label>Expiry Year</label>
                    <input type="text" class="form-control" ng-model="vm.paymentDetails.expiryYear" placeholder="YYYY" required>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group">
                    <label>CVV</label>
                    <input type="text" class="form-control" ng-model="vm.paymentDetails.cvv" placeholder="123" required>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="panel panel-default">
          <div class="panel-heading"><h4>Order Summary</h4></div>
          <div class="panel-body">
            <div ng-repeat="item in vm.checkoutData.items track by item.productId" style="border-bottom: 1px solid #eee; padding: 5px 0;">
              <p><strong>{{item.productName}}</strong></p>
              <p>Qty: {{item.quantity}} × {{item.price | currency}} = {{item.quantity * item.price | currency}}</p>
            </div>
            <hr>
            <h4>Total: {{vm.checkoutData.total | currency}}</h4>
            <button class="btn btn-success btn-block" ng-click="vm.submitPayment()" ng-disabled="vm.processing">
              <span ng-if="!vm.processing">Place Order</span>
              <span ng-if="vm.processing">Processing...</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
