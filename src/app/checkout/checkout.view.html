<div class="container">
  <h2>Checkout</h2>
  <div class="row">
    <div class="col-md-8">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Shipping Address</h4>
        </div>
        <div class="panel-body">
          <form>
            <div class="form-group">
              <label>Street Address</label>
              <input type="text" class="form-control" ng-model="vm.shippingAddress.street" required>
            </div>
            <div class="form-group">
              <label>City</label>
              <input type="text" class="form-control" ng-model="vm.shippingAddress.city" required>
            </div>
            <div class="form-group">
              <label>State</label>
              <input type="text" class="form-control" ng-model="vm.shippingAddress.state" required>
            </div>
            <div class="form-group">
              <label>Zip Code</label>
              <input type="text" class="form-control" ng-model="vm.shippingAddress.zipCode" required>
            </div>
            <div class="form-group">
              <label>Country</label>
              <input type="text" class="form-control" ng-model="vm.shippingAddress.country" required>
            </div>
          </form>
        </div>
      </div>
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Payment Information</h4>
        </div>
        <div class="panel-body">
          <form>
            <div class="form-group">
              <label>Cardholder Name</label>
              <input type="text" class="form-control" ng-model="vm.paymentData.cardholderName" required>
            </div>
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" class="form-control" ng-model="vm.paymentData.cardNumber" placeholder="1234 5678 9012 3456" required>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label>Expiry Date (MM/YY)</label>
                  <input type="text" class="form-control" ng-model="vm.paymentData.expiryDate" placeholder="12/25" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label>CVV</label>
                  <input type="text" class="form-control" ng-model="vm.paymentData.cvv" placeholder="123" required>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Order Summary</h4>
        </div>
        <div class="panel-body">
          <div ng-repeat="item in vm.cartItems track by item.cartItemId">
            <p>{{item.name}} x {{item.quantity}} - ${{item.price * item.quantity}}</p>
          </div>
          <hr>
          <h4>Total: ${{vm.total}}</h4>
          <button class="btn btn-primary btn-block" ng-click="vm.submitCheckout()" ng-disabled="vm.processing">{{vm.processing ? 'Processing...' : 'Place Order'}}</button>
        </div>
      </div>
    </div>
  </div>
</div>
