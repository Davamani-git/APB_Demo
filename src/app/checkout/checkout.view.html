<div class="row">
  <div class="col-md-12">
    <h2>Checkout</h2>
  </div>
</div>
<div class="row">
  <div class="col-md-8">
    <div class="panel panel-default">
      <div class="panel-heading">
        <h4>Shipping Address</h4>
      </div>
      <div class="panel-body">
        <form name="shippingForm">
          <div class="form-group">
            <label>Street Address</label>
            <input type="text" class="form-control" ng-model="vm.shippingAddress.street" required>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>City</label>
                <input type="text" class="form-control" ng-model="vm.shippingAddress.city" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>State</label>
                <input type="text" class="form-control" ng-model="vm.shippingAddress.state" required>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Zip Code</label>
                <input type="text" class="form-control" ng-model="vm.shippingAddress.zipCode" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Country</label>
                <input type="text" class="form-control" ng-model="vm.shippingAddress.country" required>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="panel panel-default">
      <div class="panel-heading">
        <h4>Payment Details</h4>
      </div>
      <div class="panel-body">
        <form name="paymentForm">
          <div class="form-group">
            <label>Card Holder Name</label>
            <input type="text" class="form-control" ng-model="vm.paymentDetails.cardHolder" required>
          </div>
          <div class="form-group">
            <label>Card Number</label>
            <input type="text" class="form-control" ng-model="vm.paymentDetails.cardNumber" placeholder="1234 5678 9012 3456" required>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Expiry Date (MM/YY)</label>
                <input type="text" class="form-control" ng-model="vm.paymentDetails.expiryDate" placeholder="12/25" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>CVV</label>
                <input type="text" class="form-control" ng-model="vm.paymentDetails.cvv" placeholder="123" required>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="panel panel-default">
      <div class="panel-heading">
        <h4>Order Summary</h4>
      </div>
      <div class="panel-body">
        <div ng-repeat="item in vm.cartItems">
          <p>{{item.productName}} x {{item.quantity}} - ${{item.price * item.quantity}}</p>
        </div>
        <hr>
        <h3>Total: ${{vm.total}}</h3>
        <button class="btn btn-success btn-block btn-lg" ng-click="vm.submitOrder()" ng-disabled="vm.processing">
          <span ng-if="!vm.processing">Place Order</span>
          <span ng-if="vm.processing">Processing...</span>
        </button>
        <a href="#!/cart" class="btn btn-default btn-block">Back to Cart</a>
      </div>
    </div>
  </div>
</div>
