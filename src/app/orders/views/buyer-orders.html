<div class="buyer-orders">
<h2>My Orders</h2>
<div ng-if="vm.loading" class="alert alert-info">Loading orders...</div>
<div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
<div ng-if="!vm.loading && vm.orders.length === 0" class="alert alert-warning">No orders found.</div>
<div ng-if="!vm.loading && vm.orders.length > 0">
<table class="table table-striped">
<thead>
<tr>
<th>Order ID</th>
<th>Date</th>
<th>Total Amount</th>
<th>Status</th>
<th>Payment Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody>
<tr ng-repeat="order in vm.orders track by order.orderId">
<td>{{order.orderId}}</td>
<td>{{order.createdAt | date:'short'}}</td>
<td>{{order.totalAmount | currency}}</td>
<td><span class="label" ng-class="{'label-success':order.orderStatus==='delivered','label-info':order.orderStatus==='shipped','label-warning':order.orderStatus==='processing','label-danger':order.orderStatus==='cancelled'}">{{order.orderStatus}}</span></td>
<td><span class="label" ng-class="{'label-success':order.paymentStatus==='completed','label-warning':order.paymentStatus==='pending','label-danger':order.paymentStatus==='refunded'}">{{order.paymentStatus}}</span></td>
<td>
<button class="btn btn-sm btn-info" ng-click="vm.viewTracking(order)">Track</button>
<button class="btn btn-sm btn-danger" ng-click="vm.cancelOrder(order.orderId)" ng-if="order.orderStatus !== 'cancelled' && order.orderStatus !== 'delivered'">Cancel</button>
</td>
</tr>
</tbody>
</table>
</div>
<div ng-if="vm.selectedOrder" class="panel panel-default" style="margin-top:20px;">
<div class="panel-heading">
<h4>Order Tracking: {{vm.selectedOrder.orderId}}</h4>
</div>
<div class="panel-body">
<order-tracking order="vm.selectedOrder" tracking-info="vm.trackingInfo"></order-tracking>
</div>
</div>
</div>
