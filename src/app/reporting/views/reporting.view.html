<div class="panel panel-default"><div class="panel-heading"><h3>Reports</h3></div><div class="panel-body"><div class="alert alert-danger" ng-if="reportCtrl.error">{{reportCtrl.error}}</div><form name="reportForm" ng-submit="reportCtrl.generateReport()" novalidate><div class="form-group"><label>Report Type</label><select class="form-control" ng-model="reportCtrl.reportType"><option value="SETTLEMENT">Settlement Report</option><option value="FEE">Fee Report</option><option value="TRANSACTION">Transaction Report</option></select></div><div class="form-group"><label>Start Date</label><input type="date" class="form-control" ng-model="reportCtrl.filters.startDate"></div><div class="form-group"><label>End Date</label><input type="date" class="form-control" ng-model="reportCtrl.filters.endDate"></div><div class="form-group"><label>Merchant ID</label><input type="text" class="form-control" ng-model="reportCtrl.filters.merchantId"></div><div class="form-group"><label>Currency</label><select class="form-control" ng-model="reportCtrl.filters.currency"><option value="GBP">GBP</option><option value="EUR">EUR</option><option value="USD">USD</option></select></div><button type="submit" class="btn btn-primary" ng-disabled="reportCtrl.loading">Generate Report</button></form><div ng-if="reportCtrl.reportData" style="margin-top:20px;"><h4>Report Results</h4><table class="table table-striped"><thead><tr><th ng-repeat="(key,value) in reportCtrl.reportData.data[0]">{{key}}</th></tr></thead><tbody><tr ng-repeat="row in reportCtrl.reportData.data"><td ng-repeat="(key,value) in row">{{value}}</td></tr></tbody></table><button class="btn btn-success" ng-click="reportCtrl.exportReport('CSV')">Export CSV</button></div></div></div>
