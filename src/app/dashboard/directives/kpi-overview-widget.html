<div class="kpi-overview">
  <div class="row">
    <div class="col-xs-6 col-md-3">
      <div class="kpi-tile">
        <h4>Monthly Spend</h4>
        <p class="kpi-value">₹{{kpiData.totalMonthlySpend | number:0}}</p>
      </div>
    </div>
    <div class="col-xs-6 col-md-3">
      <div class="kpi-tile">
        <h4>Total Credit Limit</h4>
        <p class="kpi-value">₹{{kpiData.totalCreditLimit | number:0}}</p>
      </div>
    </div>
    <div class="col-xs-6 col-md-3">
      <div class="kpi-tile">
        <h4>Available Credit</h4>
        <p class="kpi-value">₹{{kpiData.totalAvailableCredit | number:0}}</p>
      </div>
    </div>
    <div class="col-xs-6 col-md-3">
      <div class="kpi-tile">
        <h4>Outstanding Amount</h4>
        <p class="kpi-value">₹{{kpiData.totalOutstandingAmount | number:0}}</p>
      </div>
    </div>
  </div>
</div>
