<div><h2>AI Portfolio Dashboard</h2><div><button ng-click="vm.exportPDF()">Export PDF</button><button ng-click="vm.exportExcel()">Export Excel</button></div><div><table><thead><tr><th>Company</th><th>Total Cost</th><th>Total Usage</th><th>Status</th></tr></thead><tbody><tr ng-repeat="c in vm.companies" class="company-row" ng-click="vm.viewCompany(c.companyId)"><td>{{c.companyId}}<span ng-if="vm.freshnessMap[c.companyId]==='stale'" class="stale-icon" title="Data is stale">⚠</span></td><td>{{c.totalCost|currency}}</td><td>{{c.totalUsage}}</td><td>{{vm.freshnessMap[c.companyId]||'fresh'}}</td></tr></tbody></table></div></div>
