<div><h2>Company Detail: {{vm.companyId}}</h2><button ng-click="vm.back()">Back to Dashboard</button><div ng-if="vm.detail"><apb-widget title="Overview"><p>Total Cost: {{vm.detail.totalCost|currency}}</p><p>Total Usage: {{vm.detail.totalUsage}}</p></apb-widget><apb-widget title="Usage Breakdown"><table><thead><tr><th>Service</th><th>Cost</th><th>Usage</th></tr></thead><tbody><tr ng-repeat="b in vm.breakdown"><td>{{b.service}}</td><td>{{b.cost|currency}}</td><td>{{b.usage}}</td></tr></tbody></table></apb-widget><apb-widget title="Recommendations"><ul><li ng-repeat="r in vm.recommendations">{{r.message}}</li></ul></apb-widget></div></div>
