<div>
<h2 style="margin-bottom:20px;color:#2c3e50">Credit Card Portfolio Dashboard</h2>
<div ng-if="vm.loading" style="text-align:center;padding:40px">Loading...</div>
<div ng-if="!vm.loading" class="kpi-grid">
<div class="kpi-card">
<h3>Monthly Spend</h3>
<div class="value">₹{{vm.kpis.monthlySpend | number:0}}</div>
</div>
<div class="kpi-card">
<h3>Total Credit Limit</h3>
<div class="value">₹{{vm.kpis.totalCreditLimit | number:0}}</div>
</div>
<div class="kpi-card">
<h3>Available Credit</h3>
<div class="value">₹{{vm.kpis.availableCredit | number:0}}</div>
</div>
<div class="kpi-card">
<h3>Outstanding Amount</h3>
<div class="value">₹{{vm.kpis.outstandingAmount | number:0}}</div>
</div>
</div>
</div>
