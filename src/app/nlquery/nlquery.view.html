<div class="row">
  <div class="col-md-12">
    <h2>Ask AI About Your Finances</h2>
    <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
    <div class="nl-query-container">
      <div class="query-history">
        <div ng-repeat="item in vm.queryHistory track by $index" class="query-item" ng-class="item.type">
          <p><strong ng-if="item.type === 'user'">You:</strong><strong ng-if="item.type === 'system'">AI:</strong> {{item.text}}</p>
          <small>{{item.timestamp | date:'short'}}</small>
        </div>
        <div ng-if="vm.loading" class="text-center"><i class="glyphicon glyphicon-refresh"></i> Thinking...</div>
      </div>
      <div class="form-group">
        <input type="text" class="form-control" ng-model="vm.currentQuery" placeholder="Ask about your finances..." ng-keypress="$event.keyCode === 13 && vm.submitQuery()">
        <button class="btn btn-primary btn-block" style="margin-top: 10px;" ng-click="vm.submitQuery()" ng-disabled="vm.loading">Ask</button>
      </div>
    </div>
  </div>
</div>
