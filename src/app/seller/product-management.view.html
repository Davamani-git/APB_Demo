<div>
  <h2>Product Management</h2>
  <div class="panel panel-default">
    <div class="panel-heading"><h4 ng-if="!vm.editMode">Add New Product</h4><h4 ng-if="vm.editMode">Edit Product</h4></div>
    <div class="panel-body">
      <form ng-submit="vm.editMode ? vm.updateProduct() : vm.createProduct()">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" class="form-control" ng-model="vm.editMode ? vm.selectedProduct.name : vm.newProduct.name" required>
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea class="form-control" rows="3" ng-model="vm.editMode ? vm.selectedProduct.description : vm.newProduct.description" required></textarea>
        </div>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label>Price *</label>
              <input type="number" step="0.01" class="form-control" ng-model="vm.editMode ? vm.selectedProduct.price : vm.newProduct.price" required>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>Category *</label>
              <select class="form-control" ng-model="vm.editMode ? vm.selectedProduct.category : vm.newProduct.category" required>
                <option value="">Select Category</option>
                <option ng-repeat="cat in vm.categories" value="{{cat}}">{{cat}}</option>
              </select>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>Stock</label>
              <input type="number" class="form-control" ng-model="vm.editMode ? vm.selectedProduct.stock : vm.newProduct.stock">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>Images</label>
          <input type="file" multiple accept="image/*" ng-change="vm.uploadImages($event.target.files)">
          <p class="help-block">Max 5MB per image. Supported formats: JPG, PNG, GIF</p>
        </div>
        <button type="submit" class="btn btn-success" ng-if="!vm.editMode">Create Product</button>
        <button type="submit" class="btn btn-primary" ng-if="vm.editMode">Update Product</button>
        <button type="button" class="btn btn-default" ng-if="vm.editMode" ng-click="vm.cancelEdit()">Cancel</button>
      </form>
    </div>
  </div>
  <div class="panel panel-default">
    <div class="panel-heading"><h4>My Products</h4></div>
    <div class="panel-body">
      <div ng-if="vm.loading" class="text-center">
        <p>Loading products...</p>
      </div>
      <table class="table table-striped" ng-if="!vm.loading">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="product in vm.products track by product.id">
            <td>{{product.name}}</td>
            <td>{{product.category}}</td>
            <td>{{product.price | currency}}</td>
            <td>{{product.stock}}</td>
            <td><span class="label label-success">{{product.status}}</span></td>
            <td>
              <button class="btn btn-primary btn-sm" ng-click="vm.editProduct(product)">Edit</button>
              <button class="btn btn-danger btn-sm" ng-click="vm.deleteProduct(product.id)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
