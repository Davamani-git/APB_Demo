<div class="panel panel-danger"><div class="panel-heading"><h3>Dispute Management</h3></div><div class="panel-body"><div class="alert alert-danger" ng-if="disputeCtrl.error">{{disputeCtrl.error}}</div><table class="table table-striped"><thead><tr><th>Dispute ID</th><th>Transaction ID</th><th>Case Type</th><th>Amount</th><th>Status</th><th>Deadline</th><th>Actions</th></tr></thead><tbody><tr ng-repeat="dispute in disputeCtrl.disputes"><td>{{dispute.disputeId}}</td><td>{{dispute.transactionId}}</td><td>{{dispute.caseType}}</td><td>{{dispute.amount}} {{dispute.currency}}</td><td><span class="label label-danger">{{dispute.status}}</span></td><td><dispute-timeline dispute="dispute"></dispute-timeline></td><td><button class="btn btn-xs btn-success" ng-click="disputeCtrl.resolveDispute(dispute.disputeId,'WON')" ng-disabled="dispute.status!=='OPEN'">Win</button> <button class="btn btn-xs btn-danger" ng-click="disputeCtrl.resolveDispute(dispute.disputeId,'LOST')" ng-disabled="dispute.status!=='OPEN'">Lose</button></td></tr></tbody></table></div></div>
