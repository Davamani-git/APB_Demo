<div><h2>Cloud Provider Integration</h2><div><label>Provider <select ng-model="vm.selectedProvider" ng-options="p for p in vm.providers"><option value="">-- Select --</option></select></label><label>Access Key <input ng-model="vm.credentials.accessKey"></label><label>Secret <input type="password" ng-model="vm.credentials.secret"></label><button ng-click="vm.configure()">Configure</button></div><div><button ng-click="vm.sync()">Sync All Providers</button></div><div ng-if="vm.freshnessStatuses.length"><h3>Data Freshness</h3><table><thead><tr><th>Company</th><th>Last Updated</th><th>Status</th></tr></thead><tbody><tr ng-repeat="s in vm.freshnessStatuses"><td>{{s.companyId}}</td><td>{{s.lastUpdated|date:'short'}}</td><td ng-class="{'alert-warn':s.status!=='fresh'}">{{s.status}}</td></tr></tbody></table></div></div>
