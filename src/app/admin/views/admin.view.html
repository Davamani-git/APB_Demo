<div><h2>Role-Based Access Control</h2><div><label>User ID <input ng-model="vm.assignment.userId"></label><label>Company ID <input ng-model="vm.assignment.companyId"></label><label>Role <select ng-model="vm.assignment.role" ng-options="r for r in vm.roles"></select></label><button ng-click="vm.assignPermission()">Assign</button></div><table><thead><tr><th>User</th><th>Company</th><th>Role</th></tr></thead><tbody><tr ng-repeat="p in vm.permissions"><td>{{p.userId}}</td><td>{{p.companyId}}</td><td>{{p.role}}</td></tr></tbody></table></div>
