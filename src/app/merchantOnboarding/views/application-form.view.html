<div class="panel panel-default"><div class="panel-heading"><h3>Merchant Application</h3></div><div class="panel-body"><form name="applicationForm" ng-submit="appCtrl.submitApplication()" novalidate><div class="alert alert-danger" ng-if="appCtrl.error">{{appCtrl.error}}</div><div class="alert alert-success" ng-if="appCtrl.success">{{appCtrl.success}}</div><div class="form-group"><label>Business Name *</label><input type="text" class="form-control" ng-model="appCtrl.application.businessName" required></div><div class="form-group"><label>Business Registration Number *</label><input type="text" class="form-control" ng-model="appCtrl.application.businessRegistrationNumber" required></div><div class="form-group"><label>Address Line 1</label><input type="text" class="form-control" ng-model="appCtrl.application.businessAddress.line1"></div><div class="form-group"><label>City</label><input type="text" class="form-control" ng-model="appCtrl.application.businessAddress.city"></div><div class="form-group"><label>Postal Code</label><input type="text" class="form-control" ng-model="appCtrl.application.businessAddress.postalCode"></div><div class="form-group"><label>Country</label><input type="text" class="form-control" ng-model="appCtrl.application.businessAddress.country"></div><div class="form-group"><label>Ownership Structure</label><input type="text" class="form-control" ng-model="appCtrl.application.ownershipStructure"></div><div class="panel panel-info"><div class="panel-heading">Beneficial Owners <button type="button" class="btn btn-xs btn-primary pull-right" ng-click="appCtrl.addBeneficialOwner()">Add</button></div><div class="panel-body"><div ng-repeat="owner in appCtrl.application.beneficialOwners" class="well well-sm"><div class="row"><div class="col-md-3"><input type="text" class="form-control" placeholder="Name" ng-model="owner.name"></div><div class="col-md-2"><input type="date" class="form-control" placeholder="DOB" ng-model="owner.dob"></div><div class="col-md-2"><input type="text" class="form-control" placeholder="Nationality" ng-model="owner.nationality"></div><div class="col-md-2"><input type="number" class="form-control" placeholder="Ownership %" ng-model="owner.ownershipPercent"></div><div class="col-md-1"><button type="button" class="btn btn-danger btn-sm" ng-click="appCtrl.removeBeneficialOwner($index)">Remove</button></div></div></div></div></div><div class="form-group"><label>Bank Account Number</label><input type="text" class="form-control" ng-model="appCtrl.application.settlementBankDetails.accountNumber"></div><div class="form-group"><label>Sort Code</label><input type="text" class="form-control" ng-model="appCtrl.application.settlementBankDetails.sortCode"></div><div class="form-group"><label>Bank Name</label><input type="text" class="form-control" ng-model="appCtrl.application.settlementBankDetails.bankName"></div><div class="checkbox"><label><input type="checkbox" ng-model="appCtrl.application.gdprConsent" required> I consent to data processing per GDPR Art. 6 & 7 *</label></div><button type="submit" class="btn btn-primary" ng-disabled="appCtrl.loading||!applicationForm.$valid">Submit Application</button></form></div></div>
