<div class="panel panel-default config-panel">
  <div class="panel-heading">
    <h3 class="panel-title">Configuration</h3>
  </div>
  <div class="panel-body">
    <div class="form-group">
      <label>Theme</label>
      <theme-selector themes="configVm.themes" selected-theme="configVm.config.themeId" on-select="configVm.selectTheme(themeId)"></theme-selector>
    </div>
    <div class="checkbox">
      <label>
        <input type="checkbox" ng-model="configVm.config.showAgentificationTiles"> Show Agentification Tiles
      </label>
    </div>
    <div class="checkbox">
      <label>
        <input type="checkbox" ng-model="configVm.config.showWorkflowTiles"> Show Workflow Tiles
      </label>
    </div>
    <div class="checkbox">
      <label>
        <input type="checkbox" ng-model="configVm.config.showApbTiles"> Show APB Tiles
      </label>
    </div>
    <div class="checkbox">
      <label>
        <input type="checkbox" ng-model="configVm.config.enableConsistencyChecks"> Enable Consistency Checks
      </label>
    </div>
    <div class="form-group">
      <label>Data Source Note</label>
      <textarea class="form-control" ng-model="configVm.config.dataSourceNote" maxlength="500"></textarea>
    </div>
    <button type="button" class="btn btn-primary" ng-click="configVm.saveConfig()">Save</button>
  </div>
</div>
