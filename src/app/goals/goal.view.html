<div class="row">
  <div class="col-md-12">
    <h2>Financial Goals</h2>
    <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
    <button class="btn btn-primary" ng-click="vm.toggleCreateForm()" ng-if="!vm.showCreateForm">Create New Goal</button>
    <div ng-if="vm.showCreateForm" class="panel panel-default" style="margin-top: 15px;">
      <div class="panel-heading">Create New Goal</div>
      <div class="panel-body">
        <div class="form-group">
          <label>Goal Name:</label>
          <input type="text" class="form-control" ng-model="vm.newGoal.name" required>
        </div>
        <div class="form-group">
          <label>Target Amount:</label>
          <input type="number" class="form-control" ng-model="vm.newGoal.targetAmount" required>
        </div>
        <div class="form-group">
          <label>Target Date:</label>
          <input type="date" class="form-control" ng-model="vm.newGoal.targetDate" required>
        </div>
        <button class="btn btn-success" ng-click="vm.createGoal()">Save Goal</button>
        <button class="btn btn-default" ng-click="vm.cancelCreate()">Cancel</button>
      </div>
    </div>
    <div ng-if="vm.loading" class="text-center"><i class="glyphicon glyphicon-refresh"></i> Loading...</div>
    <div ng-if="!vm.loading && vm.goals.length === 0" class="alert alert-info">No goals created yet.</div>
    <div class="row">
      <div class="col-md-6" ng-repeat="goal in vm.goals track by goal.id">
        <goal-card goal="goal" on-delete="vm.deleteGoal(goalId)"></goal-card>
      </div>
    </div>
  </div>
</div>
