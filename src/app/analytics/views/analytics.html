<div class="analytics-container">
  <div class="page-header">
    <h1>Spend Analytics</h1>
  </div>
  <div ng-if="vm.loading" class="text-center">
    <p>Loading analytics...</p>
  </div>
  <div ng-if="vm.error" class="alert alert-danger">{{vm.error}}</div>
  <div ng-if="!vm.loading && !vm.error">
    <div class="row">
      <div class="col-md-12">
        <h3>Monthly Spend Trends</h3>
        <monthly-trend-chart trend-data="vm.monthlyTrends"></monthly-trend-chart>
      </div>
    </div>
    <div class="row" style="margin-top:30px;">
      <div class="col-md-6">
        <h3>Category-Wise Spend</h3>
        <category-chart category-data="vm.categoryData"></category-chart>
      </div>
      <div class="col-md-6">
        <h3>Card-Wise Spend</h3>
        <div class="table-responsive">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Card</th>
                <th>Spend</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="card in vm.cardWiseData">
                <td>{{card.maskedNumber}}</td>
                <td>₹{{card.spend | number:0}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
