<div class="row">
  <div class="col-md-12">
    <h2>Reports</h2>
    <div class="panel panel-default">
      <div class="panel-heading">Generate Report</div>
      <div class="panel-body">
        <form ng-submit="vm.generateReport()">
          <div class="form-group">
            <label>Company:</label>
            <select class="form-control" ng-model="vm.selectedCompany" required>
              <option ng-repeat="c in vm.companies" value="{{c.id}}">{{c.name}}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Report Type:</label>
            <select class="form-control" ng-model="vm.reportType" required>
              <option value="summary">Summary</option>
              <option value="detailed">Detailed</option>
              <option value="trend">Trend Analysis</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Generate Report</button>
        </form>
        <div ng-if="vm.reportId" style="margin-top:15px;">
          <p>Report ID: {{vm.reportId}}</p>
          <button class="btn btn-success" ng-click="vm.exportReport('pdf')">Export as PDF</button>
          <button class="btn btn-info" ng-click="vm.exportReport('csv')">Export as CSV</button>
        </div>
      </div>
    </div>
  </div>
</div>
