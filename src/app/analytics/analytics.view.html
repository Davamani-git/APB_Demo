<div class="container">
  <h2>Sales Analytics</h2>
  <div class="row">
    <div class="col-md-12">
      <div class="btn-group">
        <button class="btn btn-default" ng-class="{active: vm.period === 'daily'}" ng-click="vm.changePeriod('daily')">Daily</button>
        <button class="btn btn-default" ng-class="{active: vm.period === 'weekly'}" ng-click="vm.changePeriod('weekly')">Weekly</button>
        <button class="btn btn-default" ng-class="{active: vm.period === 'monthly'}" ng-click="vm.changePeriod('monthly')">Monthly</button>
      </div>
    </div>
  </div>
  <div class="row" ng-if="vm.metrics">
    <div class="col-md-3">
      <div class="panel panel-primary">
        <div class="panel-body text-center">
          <h4>Total Revenue</h4>
          <h2>${{vm.metrics.totalRevenue}}</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="panel panel-success">
        <div class="panel-body text-center">
          <h4>Total Orders</h4>
          <h2>{{vm.metrics.totalOrders}}</h2>
        </div>
      </div>
    </div>
  </div>
  <div class="row" ng-if="vm.performanceData">
    <div class="col-md-12">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Sales Chart</h4>
        </div>
        <div class="panel-body">
          <chart-directive data="vm.performanceData"></chart-directive>
        </div>
      </div>
    </div>
  </div>
  <div class="row" ng-if="vm.metrics && vm.metrics.topProducts">
    <div class="col-md-12">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h4>Top Products</h4>
        </div>
        <div class="panel-body">
          <table class="table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Sales</th>
                <th>Revenue</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="product in vm.metrics.topProducts track by product.productId">
                <td>{{product.name}}</td>
                <td>{{product.sales}}</td>
                <td>${{product.revenue}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
