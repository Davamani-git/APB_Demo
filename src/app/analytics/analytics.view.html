<div>
<h2 style="margin-bottom:20px;color:#2c3e50">Spend Analytics & Insights</h2>
<div ng-if="vm.loading" style="text-align:center;padding:40px">Loading...</div>
<div ng-if="!vm.loading">
<div class="filter-bar">
<label>Filter by Card:</label>
<select ng-model="vm.selectedCardId" ng-change="vm.filterByCard()">
<option value="">All Cards</option>
<option ng-repeat="card in vm.cards" value="{{card.id}}">{{card.name}}</option>
</select>
</div>
<div class="chart-container">
<h3 style="margin-bottom:15px">Monthly Spend Trends</h3>
<canvas id="monthlyTrendChart" style="max-height:300px"></canvas>
</div>
<div class="chart-container">
<h3 style="margin-bottom:15px">Category-Wise Spending</h3>
<canvas id="categoryChart" style="max-height:300px"></canvas>
</div>
</div>
</div>
