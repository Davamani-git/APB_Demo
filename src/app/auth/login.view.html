<div class="container">
  <div class="row">
    <div class="col-md-6 col-md-offset-3">
      <div class="panel panel-default">
        <div class="panel-heading">
          <h3>{{vm.isLoginMode ? 'Login' : 'Register'}}</h3>
        </div>
        <div class="panel-body">
          <form ng-submit="vm.isLoginMode ? vm.login() : vm.register()">
            <div class="form-group" ng-if="!vm.isLoginMode">
              <label>Name</label>
              <input type="text" class="form-control" ng-model="vm.credentials.name" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" ng-model="vm.credentials.email" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" class="form-control" ng-model="vm.credentials.password" required>
            </div>
            <button type="submit" class="btn btn-primary">{{vm.isLoginMode ? 'Login' : 'Register'}}</button>
            <button type="button" class="btn btn-link" ng-click="vm.toggleMode()">{{vm.isLoginMode ? 'Need an account?' : 'Already have an account?'}}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
